<!DOCTYPE html>
<html lang="zh-TW">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Noto Sans TC',sans-serif;background:#FFF8F0;margin:0}
.app{width:100%;min-height:100vh;background:#FFF8F0;padding-bottom:100px}
@media(min-width:500px){.app{max-width:430px;margin:0 auto;box-shadow:0 0 0 1px #FFE4D6,0 20px 60px rgba(255,122,69,0.12)}}
.tab-content{display:none}.tab-content.active{display:block}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:2px solid #FFF0E6;display:flex;gap:2px;padding:8px 4px;padding-bottom:calc(8px + env(safe-area-inset-bottom));z-index:50}
@media(min-width:500px){.bottom-nav{left:50%;transform:translateX(-50%);max-width:430px;width:100%}}
.nav-btn{flex:1;min-width:56px;display:flex;flex-direction:column;align-items:center;padding:6px 2px;border-radius:16px;border:none;background:transparent;color:#9C8478;font-size:10px;cursor:pointer}
.nav-btn.active{background:#FFF0E6;color:#FF7A45;font-weight:700}
.card{background:white;border:2px solid #FFE4D6;border-radius:24px;padding:16px}
.input{width:100%;background:#FFF8F0;border:2px solid #FFE4D6;border-radius:16px;padding:11px 14px;font-size:13px;outline:none}
.input:focus{border-color:#FF7A45}
.btn-primary{background:linear-gradient(135deg,#FF7A45,#FFB86A);color:white;border:none;border-radius:999px;padding:12px;font-weight:700;cursor:pointer;width:100%}
.ac-list{position:absolute;top:100%;left:0;right:0;background:white;border:2px solid #FFE4D6;border-radius:16px;margin-top:4px;max-height:260px;overflow-y:auto;z-index:30;box-shadow:0 12px 30px rgba(0,0,0,0.12)}
.ac-item{padding:10px 14px;font-size:12px;cursor:pointer;border-bottom:1px solid #FFF0E6;display:flex;justify-content:space-between;align-items:center}
.ac-item:hover{background:#FFF8F0}
.tag{font-size:9px;padding:2px 6px;border-radius:999px;border:1px solid #FFE4D6;background:#FFF8F0}
.family-chip{padding:6px 12px;border-radius:999px;font-size:12px;border:2px solid #FFE4D6;background:white;cursor:pointer;white-space:nowrap}
.family-chip.active{background:#FF7A45;color:white;border-color:#FF7A45;font-weight:700}
</style>
</head>
<body>
<div class="app">
  <div class="bg-gradient-to-br from-[#FF7A45] to-[#FFB86A] text-white p-5 pt-8 rounded-b-[32px]">

    <div class="mt-3 bg-white/20 backdrop-blur rounded-2xl p-2.5 flex gap-2 text-[10px]"><span>📚 商品庫：3324 項</span><span>·</span><span>全球269項已補齊</span><span>·</span><span id="cloud-status">✅ 單檔已載入</span></div>
  </div>

  <div class="p-3">
    <div id="tab-policies" class="tab-content active">

      <div id="policies-list" class="space-y-3"></div>
      <button class="mt-4 text-[10px] bg-white border px-3 py-1.5 rounded-full" onclick="if(confirm('重置所有資料？')){localStorage.clear(); location.reload();}">重置資料</button>
    </div>

    <div id="tab-add" class="tab-content">
      <h2 class="font-bold text-[14px] mb-2">➕ 建立保單 - 真實商品聯想</h2>
      <div class="flex bg-[#FFF0E6] rounded-full p-1 w-fit mb-3"><button id="mode-m" class="px-4 py-1.5 bg-white shadow rounded-full text-xs font-bold text-[#FF7A45]" onclick="setMode('manual')">手寫輸入</button><button id="mode-p" class="px-4 py-1.5 text-xs text-[#9C8478]" onclick="setMode('photo')">拍照解析</button></div>
      <div id="add-manual">

          <div><label class="text-[11px] font-bold">👤 歸屬</label><div id="assign-family" class="flex gap-2 mt-1 flex-wrap"></div></div>
          <div><label class="text-[11px] font-bold">🏢 保險公司</label>

            <div id="riders-list" class="space-y-2 mt-2"></div>
            <button class="text-[11px] text-[#2A9D8F] font-bold mt-2" onclick="addRider()">+ 新增附約</button>

        </div>
      </div>

          <div id="ocr-preview" class="hidden mt-3"></div>
        </div>
      </div>

            <input id="r-doctor" placeholder="醫師 (選填)" class="input !bg-white !py-2 text-[12px]">

          <button class="btn-primary mt-3 !py-2.5 text-[13px]" onclick="saveReceipt()">💾 儲存收據紀錄</button>
        </div>
      </div>
      <div class="mt-4"><div class="flex justify-between items-center mb-2 px-1"><h3 class="font-bold text-[12px]">📋 收據紀錄</h3></div><div id="receipt-list" class="space-y-2"></div><div id="receipt-empty" class="card text-center py-6 text-[11px] text-[#9C8478]">還沒有收據</div></div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn active" data-tab="policies" onclick="switchTab('policies')"><span style="font-size:18px">📑</span><span>保單</span></button>
    <button class="nav-btn" data-tab="add" onclick="switchTab('add')"><span style="font-size:18px">➕</span><span>新增</span></button>
    <button class="nav-btn" data-tab="terms" onclick="switchTab('terms')"><span style="font-size:18px">🔍</span><span>條款</span></button>
    <button class="nav-btn" data-tab="doctor" onclick="switchTab('doctor')"><span style="font-size:18px">🏥</span><span>醫囑</span></button>
    <button class="nav-btn" data-tab="receipt" onclick="switchTab('receipt')"><span style="font-size:18px">🧾</span><span>收據</span></button>
  </div>
</div>

function switchTab(t){
  document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));
  const target=document.getElementById('tab-'+t);
  if(target) target.classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const btn=document.querySelector(`[data-tab="${t}"]`);
  if(btn) btn.classList.add('active');
  window.scrollTo(0,0);
}
function setMode(m){document.getElementById('add-manual').style.display=m==='manual'?'block':'none'; document.getElementById('add-photo').style.display=m==='photo'?'block':'none'; document.getElementById('mode-m').className=m==='manual'?'px-4 py-1.5 bg-white shadow rounded-full text-xs font-bold text-[#FF7A45]':'px-4 py-1.5 text-xs text-[#9C8478]'; document.getElementById('mode-p').className=m==='photo'?'px-4 py-1.5 bg-white shadow rounded-full text-xs font-bold text-[#FF7A45]':'px-4 py-1.5 text-xs text-[#9C8478]';}

function onCompanyInput(val){const ac=document.getElementById('company-ac'); if(!val){ac.style.display='none';return;} const companies=[...new Set(PRODUCTS_DB.map(p=>p.company))]; const filtered=companies.filter(c=>c.toLowerCase().includes(val.toLowerCase())).slice(0,8); if(filtered.length===0){ac.style.display='none';return;} ac.innerHTML=filtered.map(c=>`<div class="ac-item" onclick="pickCompany('${c}')"><span class="name">${c}</span><span class="tag">30年內</span></div>`).join(''); ac.style.display='block';}
function pickCompany(c){document.getElementById('f-company').value=c; document.getElementById('company-ac').style.display='none';}
function onMainInput(val){const ac=document.getElementById('main-ac'); if(!val){ac.style.display='none';return;} const filtered=PRODUCTS_DB.filter(p=>p.type==='主約' && (p.name.toLowerCase().includes(val.toLowerCase()) || p.company.toLowerCase().includes(val.toLowerCase()))).slice(0,12); if(filtered.length===0){ac.innerHTML=`<div class="ac-item">無匹配「${val}」</div>`; ac.style.display='block'; return;} ac.innerHTML=filtered.map(p=>`<div class="ac-item" onclick="pickMain('${p.name.replace(/'/g,"\'")}','${p.company}')"><div><div class="name">${p.company} <b>${p.name}</b></div><div class="text-[10px] text-[#9C8478]">${p.category} · ${p.year}年 · ${p.status}</div></div><span class="tag">${p.type}</span></div>`).join(''); ac.style.display='block';}
function pickMain(name, company){document.getElementById('f-main').value=name; if(company) document.getElementById('f-company').value=company; document.getElementById('main-ac').style.display='none'; if(name.includes('已停售')||name.includes('鍾愛')||name.includes('LDG')) document.getElementById('f-disc').checked=true;}
function addRider(data=null){const c=document.getElementById('riders-list'); const div=document.createElement('div'); div.className='relative flex gap-2'; div.innerHTML=`<div class="relative flex-1"><input placeholder="附約關鍵字" class="input !bg-white !py-2 text-[12px] rider-input" value="${data?.name||''}" oninput="onRiderInput(this, this.value)"></div><input placeholder="保額" class="input !bg-white !py-2 text-[11px] w-20" value="${data?.amount||''}"><button class="px-1" onclick="this.parentElement.remove()">×</button><div class="ac-list" style="display:none"></div>`; c.appendChild(div);}
function onRiderInput(input, val){let acList = input.parentElement.parentElement.querySelector('.ac-list'); if(!acList){acList=document.createElement('div'); acList.className='ac-list'; input.parentElement.parentElement.appendChild(acList);} if(!val){acList.style.display='none';return;} const filtered=PRODUCTS_DB.filter(p=>p.type==='附約' && p.name.toLowerCase().includes(val.toLowerCase())).slice(0,8); if(filtered.length===0){acList.style.display='none';return;} acList.innerHTML=filtered.map(p=>`<div class="ac-item" onclick="pickRiderItem(this, '${p.name.replace(/'/g,"\'")}')"><span class="name">${p.company} ${p.name}</span><span class="tag">${p.category}</span></div>`).join(''); acList.style.display='block';}
function pickRiderItem(el, name){const input=el.closest('div').parentElement.querySelector('.rider-input'); if(input) input.value=name; el.parentElement.style.display='none';}
function savePolicy(){const company=document.getElementById('f-company').value; const main=document.getElementById('f-main').value; const amount=document.getElementById('f-amount').value; const premium=parseInt(document.getElementById('f-premium').value)||0; const date=document.getElementById('f-date').value; const years=document.getElementById('f-years').value; const disc=document.getElementById('f-disc').checked; if(!company||!main){alert('請選公司和主約');return;} const riders=[]; document.querySelectorAll('#riders-list > div').forEach(row=>{const inp=row.querySelectorAll('input'); if(inp[0]?.value) riders.push({name:inp[0].value, amount:inp[1]?.value||''});}); policies.push({id:Date.now(), family:currentFamily, company, main, amount:amount||'未填', premium, date, years:years||'未填', discontinued:disc, riders}); save(); alert('✅ 已儲存'); document.getElementById('f-company').value=''; document.getElementById('f-main').value=''; document.getElementById('f-amount').value=''; document.getElementById('f-premium').value=''; document.getElementById('riders-list').innerHTML=''; addRider(); switchTab('policies');}
function deletePolicy(id){if(confirm('刪除？')){policies=policies.filter(p=>p.id!==id); save();}}
function editPolicy(id){const p=policies.find(x=>x.id===id); if(!p)return; currentFamily=p.family; document.getElementById('f-company').value=p.company; document.getElementById('f-main').value=p.main; document.getElementById('f-amount').value=p.amount; document.getElementById('f-premium').value=p.premium; document.getElementById('f-date').value=p.date||''; document.getElementById('f-years').value=p.years; document.getElementById('f-disc').checked=p.discontinued; document.getElementById('riders-list').innerHTML=''; p.riders.forEach(r=>addRider(r)); policies=policies.filter(x=>x.id!==id); save(); switchTab('add'); setMode('manual');}

function searchTerms(val){
  const list=document.getElementById('terms-list');
  if(!val){list.innerHTML='<p class=text-[#9C8478]>輸入商品名稱搜尋條款，例如 全心溢靠 / 全球LDG</p>';return;}
  const filtered=PRODUCTS_DB.filter(p=>p.name.toLowerCase().includes(val.toLowerCase())).slice(0,10);
  list.innerHTML=filtered.map(p=>{
    const detail = getDetailedTerm(p.name);
    const officialLink = getOfficialLink(p.company, p.name);
    const detailHtml = detail ? `
      <div class="mt-2 bg-white rounded-xl p-2.5 border border-[#FFE4D6] text-[11px] leading-5">
        <p class="font-bold text-[#4A3728]">${detail.full_name}</p>
        <p><b class="text-[#FF7A45]">類型：</b>${detail.type}</p>
        <p><b class="text-[#FF7A45]">等待期：</b>${detail.waiting}</p>
        <p><b class="text-[#FF7A45]">保障：</b>${detail.coverage}</p>
        <p><b class="text-[#FF7A45]">除外：</b>${detail.exclusion}</p>
        <p><b class="text-[#FF7A45]">續保：</b>${detail.renewal}</p>
        <div class="flex gap-2 mt-3 flex-wrap">
          <a href="${officialLink}" target="_blank" class="text-[10px] bg-[#FF7A45] text-white px-3 py-1.5 rounded-full inline-block">🔗 前往${p.company}官網</a>
          <a href="https://www.google.com/search?q=${encodeURIComponent(p.company+'+'+p.name+'+條款PDF')}" target="_blank" class="text-[10px] bg-white border px-3 py-1.5 rounded-full inline-block">📄 搜尋條款PDF</a>
          <button class="text-[10px] bg-[#4A3728] text-white px-3 py-1.5 rounded-full" onclick="addToMyPolicy('${p.company}','${p.name}')">+ 加入保單</button>
        </div>
      </div>
    ` : `
      <p class="text-[10px] text-[#9C8478] mt-1">${p.year}年 · ${p.status} · ${p.category}</p>
      <div class="flex gap-2 mt-2 flex-wrap">
        <a href="${officialLink}" target="_blank" class="text-[10px] bg-[#FF7A45] text-white px-3 py-1.5 rounded-full inline-block">🔗 前往${p.company}官網查看 ${p.name}</a>
        <button class="text-[10px] bg-white border px-3 py-1.5 rounded-full" onclick="addToMyPolicy('${p.company}','${p.name}')">+ 加入</button>
      </div>
    `;
    return `<div class="bg-[#FFF8F0] rounded-xl p-3 border"><p class="font-bold text-[12px]">${p.company} ${p.name}</p>${detailHtml}</div>`;
  }).join('');
}

function renderReceipts(filter='all'){
  const list=document.getElementById('receipt-list'); const empty=document.getElementById('receipt-empty');
  const filtered = filter==='pending' ? receipts.filter(r=>r.status==='待申請') : receipts;
  const total = receipts.reduce((s,r)=>s+(parseInt(r.amount)||0),0);
  const totalEl=document.getElementById('receipt-total'); if(totalEl) totalEl.textContent = '$'+total.toLocaleString();
  const countEl=document.getElementById('receipt-count'); if(countEl) countEl.textContent = filtered.length + ' 筆收據';
  if(filtered.length===0){list.innerHTML=''; if(empty) empty.style.display='block'; return;} if(empty) empty.style.display='none';
  list.innerHTML = filtered.slice().reverse().map(r=>{
    const fam = families.find(f=>f.id===r.family);
    return `<div class="card !p-3 !rounded-2xl"><div class="flex gap-3"><div class="w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0 bg-[#E6F9F7]">🧾</div><div class="flex-1 min-w-0"><div class="flex justify-between items-start gap-2"><div><p class="font-bold text-[12px] text-[#4A3728]">${r.hospital} · ${r.dept}</p><p class="text-[10px] text-[#9C8478] mt-0.5">📅 ${r.date} · ${r.type} ${fam? '· '+fam.emoji+fam.name:''}</p></div><div class="text-right flex-shrink-0"><p class="font-bold text-[13px] text-[#FF7A45]">$${r.amount}</p><span class="text-[9px] px-2 py-0.5 rounded-full bg-[#FFF0E6] text-[#FF7A45]">${r.status}</span></div></div><div class="flex gap-2 mt-2"><button class="text-[10px] bg-[#FFF0E6] border px-2.5 py-1 rounded-full" onclick="editReceipt(${r.id})">編輯</button><button class="text-[10px] bg-red-50 text-red-500 border px-2.5 py-1 rounded-full" onclick="deleteReceipt(${r.id})">刪除</button></div></div></div></div>`;
  }).join('');
}
function saveReceipt(){const date=document.getElementById('r-date').value || new Date().toISOString().split('T')[0]; const hospital=document.getElementById('r-hospital').value; const dept=document.getElementById('r-dept').value; const amount=parseInt(document.getElementById('r-amount').value)||0; const doctor=document.getElementById('r-doctor').value; const type=document.getElementById('r-type').value; const note=document.getElementById('r-note').value; const family=document.getElementById('r-family').value || currentFamily; const policy=document.getElementById('r-policy').value; if(!hospital||!amount){alert('請填醫院和金額');return;} receipts.push({id:Date.now(), family, date, hospital, dept: dept||'未分科', type, amount, doctor, note, policy, status:'待申請', hasPhoto: !!window._lastReceiptPhoto}); window._lastReceiptPhoto=false; saveReceipts(); document.getElementById('r-hospital').value=''; document.getElementById('r-amount').value=''; document.getElementById('r-note').value=''; alert('✅ 已儲存');}
function deleteReceipt(id){if(confirm('刪除？')){receipts=receipts.filter(r=>r.id!==id); saveReceipts();}}
function editReceipt(id){const r=receipts.find(x=>x.id===id); if(!r)return; document.getElementById('r-date').value=r.date; document.getElementById('r-hospital').value=r.hospital; document.getElementById('r-dept').value=r.dept; document.getElementById('r-amount').value=r.amount; document.getElementById('r-doctor').value=r.doctor||''; document.getElementById('r-type').value=r.type; document.getElementById('r-note').value=r.note||''; receipts=receipts.filter(x=>x.id!==id); saveReceipts(); switchTab('receipt');}

renderAll();
