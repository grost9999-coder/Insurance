<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>客戶保險資料庫</title>

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="保險資料庫" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#16233A" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2316233A'/%3E%3Cpath d='M50 20 L76 30 V50 C76 66 65 78 50 84 C35 78 24 66 24 50 V30 Z' fill='none' stroke='%23C9A227' stroke-width='4'/%3E%3Cpath d='M39 50 L47 58 L63 40' fill='none' stroke='%23C9A227' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
  :root{
    --ink:#16233A; --paper:#F3F1EA; --card:#FBFAF6; --line:#E3DECD; --line2:#EFEBDF;
    --muted:#8B93A1; --teal:#2F6F62; --teal-dark:#265A50; --gold:#C9A227;
    --ok-bg:#EAF2EE; --ok-fg:#2F6F62; --bad-bg:#F6E9E3; --bad-fg:#B5502C;
    --warn-bg:#FCF3DE; --warn-fg:#9A7511;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Noto Sans TC', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .serif{ font-family:'Noto Serif TC', serif; }
  .mono{ font-family:'JetBrains Mono', ui-monospace, monospace; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:#D8D2C2; border-radius:8px; }

  #app{ display:flex; flex-direction:column; height:100vh; }

  header{
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line); background:var(--card);
    padding:14px 18px; flex-shrink:0; gap:10px;
  }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .brand-icon{
    width:36px; height:36px; border-radius:8px; background:var(--ink);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand h1{ margin:0; font-size:16px; font-weight:700; line-height:1.2; }
  .brand p{ margin:2px 0 0; font-size:11px; color:var(--muted); }
  .btn{
    display:inline-flex; align-items:center; gap:6px; border:none; cursor:pointer;
    border-radius:8px; padding:9px 14px; font-size:13px; font-weight:500;
    font-family:inherit; transition:background .15s; white-space:nowrap;
  }
  .btn-primary{ background:var(--teal); color:#fff; }
  .btn-primary:hover{ background:var(--teal-dark); }
  .btn-dark{ background:var(--ink); color:#fff; }
  .btn-dark:hover{ background:#1F3050; }
  .btn-ghost{ background:transparent; color:var(--muted); }
  .btn-ghost:hover{ background:var(--line2); }
  .btn-danger{ background:transparent; color:var(--bad-fg); border:1px solid #E3B8A5; }
  .btn-danger:hover{ background:#FBF0E7; }

  #error-bar{
    display:none; align-items:center; gap:8px; padding:8px 18px;
    background:#FBF0E7; color:var(--bad-fg); border-bottom:1px solid #F0D9C8; font-size:13px;
  }

  #nav-tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); background:var(--card); padding:0 18px; flex-shrink:0; }
  .tab-btn{
    background:none; border:none; cursor:pointer; font-family:inherit; font-size:13px; font-weight:500;
    padding:10px 4px; color:var(--muted); border-bottom:2px solid transparent; margin-right:18px;
  }
  .tab-btn.active{ color:var(--ink); border-bottom-color:var(--teal); }
  .tab-btn .badge{
    display:inline-flex; align-items:center; justify-content:center; min-width:16px; height:16px;
    border-radius:999px; background:var(--bad-fg); color:#fff; font-size:10px; padding:0 4px; margin-left:5px;
  }

  .layout{ flex:1; display:flex; overflow:hidden; min-height:0; }

  #sidebar{
    width:100%; max-width:340px; flex-shrink:0; background:var(--card);
    border-right:1px solid var(--line); display:flex; flex-direction:column;
  }
  .search-wrap{ padding:10px; border-bottom:1px solid var(--line); }
  .search-box{
    display:flex; align-items:center; gap:8px; background:#fff;
    border:1px solid #DDD7C9; border-radius:8px; padding:8px 10px;
  }
  .search-box input{
    border:none; outline:none; background:transparent; font-size:13px; width:100%;
    font-family:inherit; color:var(--ink);
  }
  #list{ flex:1; overflow-y:auto; }
  .list-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; border-bottom:1px solid var(--line2); cursor:pointer;
    text-align:left; background:none; width:100%; border-left:none; border-right:none; border-top:none;
    font-family:inherit;
  }
  .list-item:hover{ background:#F3F1E8; }
  .list-item.active{ background:#EEF3F0; }
  .list-item .name{ font-size:13px; font-weight:500; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:6px; }
  .list-item .num{ font-size:11px; color:var(--muted); margin-top:2px; }
  .flag-dot{ width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .empty-list{ display:flex; flex-direction:column; align-items:center; gap:8px; padding:60px 24px; text-align:center; color:var(--muted); }

  #main{ flex:1; overflow-y:auto; padding:20px; }
  .detail-wrap{ max-width:720px; margin:0 auto; }
  .placeholder{ display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--muted); text-align:center; }

  .pill{ display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:2px 10px; font-size:11px; font-weight:500; }
  .pill-ok{ background:var(--ok-bg); color:var(--ok-fg); }
  .pill-bad{ background:var(--bad-bg); color:var(--bad-fg); }
  .pill-warn{ background:var(--warn-bg); color:var(--warn-fg); }
  .dot{ width:6px; height:6px; border-radius:50%; }
  .dot-ok{ background:var(--ok-fg); }
  .dot-bad{ background:var(--bad-fg); }
  .dot-warn{ background:var(--warn-fg); }

  .passbook{ border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--card); }
  .passbook-head{ display:flex; align-items:center; justify-content:space-between; background:var(--ink); padding:12px 18px; }
  .passbook-head .insurer{ display:flex; align-items:center; gap:8px; color:#F3F1EA; font-weight:600; font-size:13px; }
  .passbook-head .gold-dot{ width:8px; height:8px; border-radius:50%; background:var(--gold); }
  .passbook-head .cur{ color:var(--gold); font-size:12px; }
  .passbook-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px 24px; padding:18px; }
  .field-label{ font-size:11px; color:var(--muted); margin-bottom:3px; }
  .field-value{ font-size:14px; font-weight:500; }
  .field-value.big{ font-size:16px; font-weight:700; }

  .section-card{ border:1px solid var(--line); border-radius:14px; background:#fff; padding:18px; margin-top:16px; }
  .section-head{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .section-head h2{ margin:0; font-size:14px; font-weight:700; color:var(--ink); flex:1; }
  .section-head .subtotal{ font-size:12px; color:var(--muted); }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{ text-align:left; font-size:11px; color:var(--muted); font-weight:500; padding:8px 10px; background:#F6F4EC; }
  tbody td{ padding:8px 10px; border-top:1px solid var(--line2); }
  .ta-right{ text-align:right; }

  .beneficiary-row{ display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-top:1px solid var(--line2); font-size:13px; }
  .beneficiary-row:first-child{ border-top:none; }
  .beneficiary-row .rank{ font-size:11px; color:var(--muted); }

  .actions-row{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; padding-bottom:24px; }

  .reminder-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-top:1px solid var(--line2); }
  .reminder-row:first-child{ border-top:none; }
  .reminder-row:hover{ cursor:pointer; }
  .reminder-name{ font-size:13px; font-weight:600; }
  .reminder-sub{ font-size:11px; color:var(--muted); margin-top:1px; }

  .dash-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:600px){ .dash-grid{ grid-template-columns:1fr; } }
  .stat-card{ border:1px solid var(--line); border-radius:12px; background:#fff; padding:14px 16px; }
  .stat-num{ font-size:24px; font-weight:700; font-family:'Noto Serif TC',serif; color:var(--ink); }
  .stat-label{ font-size:11px; color:var(--muted); margin-top:2px; }

  #modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.4);
    align-items:center; justify-content:center; padding:16px; z-index:50;
  }
  #modal{
    width:100%; max-width:640px; max-height:90vh; background:var(--card);
    border-radius:14px; display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--line); }
  .modal-head h3{ margin:0; font-size:15px; font-weight:700; }
  .modal-body{ flex:1; overflow-y:auto; padding:16px 18px; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:8px; padding:14px 18px; border-top:1px solid var(--line); }

  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .form-group{ display:flex; flex-direction:column; gap:4px; }
  .form-group label{ font-size:11px; color:var(--muted); font-weight:500; }
  .form-group input, .form-group textarea{
    border:1px solid #DDD7C9; border-radius:6px; padding:8px 10px; font-size:13px;
    font-family:inherit; background:#FBFAF6; outline:none; color:var(--ink);
  }
  .form-group input:focus, .form-group textarea:focus{ border-color:var(--teal); box-shadow:0 0 0 3px rgba(47,111,98,.12); }
  .subblock{ margin-top:18px; padding-top:14px; border-top:1px solid var(--line2); }
  .subblock-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .subblock-head p{ margin:0; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); }
  .link-btn{ background:none; border:none; cursor:pointer; color:var(--teal); font-size:12px; font-weight:500; font-family:inherit; display:flex; align-items:center; gap:4px; }
  .link-btn:hover{ text-decoration:underline; }
  .dyn-row{ display:grid; grid-template-columns:repeat(12,1fr); gap:6px; align-items:center; border:1px solid var(--line2); background:#fff; border-radius:8px; padding:8px; margin-bottom:6px; }
  .dyn-row input{ border:1px solid #DDD7C9; border-radius:6px; padding:7px 8px; font-size:12px; font-family:inherit; background:#FBFAF6; outline:none; }
  .dyn-row input:focus{ border-color:var(--teal); }
  .col-3{ grid-column:span 3; } .col-2{ grid-column:span 2; } .col-5{ grid-column:span 5; } .col-6{ grid-column:span 6; } .col-1{ grid-column:span 1; } .col-4{ grid-column:span 4; }
  .row-del{ display:flex; justify-content:center; background:none; border:none; cursor:pointer; color:var(--bad-fg); }

  svg{ display:block; }

  @media (max-width:760px){
    .layout{ position:relative; }
    #sidebar{ position:absolute; inset:0; max-width:none; z-index:5; transition:transform .2s ease; }
    #sidebar.hide{ transform:translateX(-100%); }
    #main{ padding:14px; }
    .passbook-grid{ grid-template-columns:1fr 1fr; gap:12px 16px; padding:14px; }
    .form-grid{ grid-template-columns:1fr; }
    #back-btn{ display:inline-flex; }
    .brand p{ display:none; }
  }
  #back-btn{ display:none; }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <button id="back-btn" class="btn btn-ghost" style="padding:6px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16233A" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9A227" stroke-width="2"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5l8-3z"/><path d="M9 12l2 2 4-4"/></svg>
      </div>
      <div>
        <h1 class="serif">客戶保險資料庫</h1>
        <p>保單管理・提醒追蹤・回購紀錄</p>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <span id="saving-indicator" style="display:none; font-size:11px; color:var(--muted);">儲存中…</span>
      <button class="btn btn-primary" onclick="openNewPolicy()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        新增保單
      </button>
    </div>
  </header>

  <div id="error-bar">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B5502C" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    <span id="error-text"></span>
  </div>

  <nav id="nav-tabs">
    <button class="tab-btn" id="tab-dashboard" onclick="switchTab('dashboard')">總覽提醒</button>
    <button class="tab-btn" id="tab-customers" onclick="switchTab('customers')">客戶保單</button>
  </nav>

  <div class="layout">
    <aside id="sidebar">
      <div class="search-wrap">
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B93A1" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="search-input" placeholder="搜尋保單號碼／姓名" oninput="renderList()" />
        </div>
        <div id="segment-chips" style="display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;"></div>
      </div>
      <div class="search-wrap" style="display:flex; gap:6px;">
        <button class="btn btn-ghost" style="flex:1; justify-content:center; border:1px solid var(--line); font-size:11px; padding:6px;" onclick="exportCSV()">匯出 CSV</button>
        <button class="btn btn-ghost" style="flex:1; justify-content:center; border:1px solid var(--line); font-size:11px; padding:6px;" onclick="document.getElementById('csv-input').click()">匯入 CSV</button>
        <input type="file" id="csv-input" accept=".csv" style="display:none;" onchange="handleCsvImport(event)" />
      </div>
      <div id="list"></div>
    </aside>

    <main id="main">
      <div id="main-content"></div>
    </main>
  </div>
</div>

<div id="modal-overlay">
  <div id="modal">
    <div class="modal-head">
      <h3 id="modal-title" class="serif">新增保單</h3>
      <button class="btn btn-ghost" style="padding:6px;" onclick="closeModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B93A1" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="commitEdit()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
        儲存
      </button>
    </div>
  </div>
</div>

<div id="ocr-overlay" style="display:none; position:fixed; inset:0; background:rgba(22,35,58,.55); align-items:center; justify-content:center; z-index:60;">
  <div style="background:#FBFAF6; border-radius:14px; padding:28px 32px; width:280px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.3);">
    <div style="width:34px; height:34px; margin:0 auto 14px; border:3px solid #E3DECD; border-top-color:#2F6F62; border-radius:50%; animation:spin 0.8s linear infinite;"></div>
    <p id="ocr-status" class="serif" style="margin:0 0 4px; font-size:14px; color:#16233A;">辨識中…</p>
    <p id="ocr-substatus" style="margin:0; font-size:11px; color:#8B93A1;">請稍候</p>
  </div>
</div>
<style>@keyframes spin{ to{ transform:rotate(360deg); } }</style>

<div id="batch-overlay" style="display:none; position:fixed; inset:0; background:rgba(22,35,58,.55); align-items:center; justify-content:center; z-index:60; padding:16px;">
  <div style="background:#FBFAF6; border-radius:14px; padding:20px; width:100%; max-width:340px; box-shadow:0 20px 50px rgba(0,0,0,.3);">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <span id="batch-progress" style="font-size:11px; color:#8B93A1;">1 / 1</span>
      <button class="btn btn-ghost" style="padding:4px;" onclick="closeBatchStepper()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B93A1" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <p id="batch-name" class="serif" style="margin:0 0 8px; font-size:16px; font-weight:700; color:#16233A;">—</p>
    <p id="batch-msg-preview" style="margin:0 0 16px; font-size:12px; color:#4A5266; background:#F6F4EC; border-radius:8px; padding:10px; white-space:pre-wrap;"></p>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-primary" style="flex:1; justify-content:center;" onclick="batchSendCurrent()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        用 LINE 傳送
      </button>
      <button class="btn btn-dark" onclick="batchNext()" id="batch-next-btn">下一位</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'insurance_policies_v2';
const REMIND_WINDOW_DAYS = 30; // days ahead to flag birthdays / health-check / renewal

let policies = [];
let selectedId = null;
let editing = null;
let lastOcrRawText = '';
let activeTab = 'dashboard'; // 'dashboard' | 'customers'

function uid(){ return 'p_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

function emptyCoverage(){ return { id: uid(), name:'', amount:'', status:'有效', effectiveDate:'', premium:'' }; }
function emptyBeneficiary(){ return { id: uid(), name:'', rank:'第一順位(均分)' }; }
function emptyLog(){ return { id: uid(), date:'', type:'回購', item:'', amount:'', note:'' }; }
function emptyPolicy(){
  return {
    id: uid(), insurer:'南山人壽', policyNumber:'', currency:'台幣', coverageUnit:'元', effectiveDate:'',
    status:'有效-持續繳費中', payMethod:'年繳', advanceStatus:'無', insured:'', applicant:'',
    insuredBirthday:'', applicantBirthday:'', phone:'',
    payChannel:'', bank:'', cardLast4:'', cardExpiry:'', nextDueDate:'', nextDeductDate:'',
    lastCheckDate:'', nextCheckDate:'', checkNotes:'',
    coverages:[emptyCoverage()], beneficiaries:[emptyBeneficiary()], logs:[], notes:'',
    contactedFor:{ birthday_insured:'', birthday_applicant:'', check:'', renew:'' }
  };
}

function seedPolicies(){
  return []; // no pre-filled data — add customers via "新增保單" or "拍照／上傳辨識"
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      policies = JSON.parse(raw);
      policies.forEach(p=>{
        if(!('insuredBirthday' in p)) p.insuredBirthday = p.birthday || '';
        if(!('applicantBirthday' in p)) p.applicantBirthday = '';
        if(!('coverageUnit' in p)) p.coverageUnit='元';
        if(!('phone' in p)) p.phone='';
        if(!('lastCheckDate' in p)) p.lastCheckDate='';
        if(!('nextCheckDate' in p)) p.nextCheckDate='';
        if(!('checkNotes' in p)) p.checkNotes='';
        if(!('logs' in p)) p.logs=[];
        if(!('contactedFor' in p)) p.contactedFor={ birthday_insured:'', birthday_applicant:'', check:'', renew:'' };
      });
      if(policies.length) selectedId = policies[0].id;
    } else {
      policies = seedPolicies();
      selectedId = policies[0].id;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(policies));
    }
  }catch(e){ /* ignore */ }
}

function saveData(){
  const ind = document.getElementById('saving-indicator');
  ind.style.display = 'inline';
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(policies));
    hideError();
  }catch(e){
    showError('儲存失敗，裝置儲存空間可能不足');
  }
  setTimeout(()=>{ ind.style.display='none'; }, 300);

/* ---- marketing segmentation: VIP / coverage-gap tags computed from policy data ---- */
const VIP_PREMIUM_THRESHOLD = 30000;
const SEGMENT_DEFS = [
  { key:'vip', label:'VIP高保費', tone:'gold', test:p=> totalPremium(p) >= VIP_PREMIUM_THRESHOLD },
  { key:'gap-life', label:'缺壽險保障', tone:'warn', test:p=> !/壽險|終身|生存/.test(coverageNamesText(p)) },
  { key:'gap-medical', label:'缺醫療保障', tone:'warn', test:p=> !/醫療|住院/.test(coverageNamesText(p)) },
  { key:'gap-accident', label:'缺意外保障', tone:'warn', test:p=> !/意外/.test(coverageNamesText(p)) },
  { key:'gap-ltc', label:'缺長照/重大傷病', tone:'warn', test:p=> !/長照|失能|重大傷病|防癌|癌症/.test(coverageNamesText(p)) },
];
function coverageNamesText(p){
  return (p.coverages||[]).map(c=>c.name||'').join(' ');
}
function computeInsightTags(p){
  if(!(p.coverages||[]).some(c=>c.name)) return []; // no coverage data entered yet — nothing to infer
  return SEGMENT_DEFS.filter(seg=>seg.test(p));
}
function segmentTagHtml(tag){
  const cls = tag.tone==='gold' ? 'pill-warn' : 'pill-bad';
  return `<span class="pill ${cls}" style="${tag.tone==='gold' ? 'background:#FCF3DE;color:#9A7511;' : ''}">${esc(tag.label)}</span>`;
}

/* ---- date helpers for reminders ---- */
function parseDateFlexible(str){
  // accepts YYYY/MM/DD, YYYY-MM-DD, MM/DD, MM-DD
  if(!str) return null;
  const s = str.trim();
  let m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if(m) return { y:+m[1], mo:+m[2], d:+m[3], hasYear:true };
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})$/);
  if(m) return { y:null, mo:+m[1], d:+m[2], hasYear:false };
  return null;
}
function daysUntilNextOccurrence(dateObj){
  if(!dateObj) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  let year = today.getFullYear();
  let candidate = new Date(year, dateObj.mo-1, dateObj.d);
  candidate.setHours(0,0,0,0);
  if(candidate < today) candidate = new Date(year+1, dateObj.mo-1, dateObj.d);
  const diff = Math.round((candidate - today) / 86400000);
  return diff;
}
function daysUntilFixedDate(dateObj){
  if(!dateObj || !dateObj.hasYear) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateObj.y, dateObj.mo-1, dateObj.d);
  target.setHours(0,0,0,0);
  return Math.round((target - today) / 86400000);
}

function isContacted(p, kind, dateValue){
  return !!(p.contactedFor && p.contactedFor[kind] && dateValue && p.contactedFor[kind] === dateValue);
}

function getReminders(){
  const insuredBirthdayList = [];
  const applicantBirthdayList = [];
  const checkList = [];
  const renewalList = [];
  policies.forEach(p=>{
    const bdInsured = parseDateFlexible(p.insuredBirthday);
    if(bdInsured){
      const days = daysUntilNextOccurrence(bdInsured);
      if(days !== null && days <= REMIND_WINDOW_DAYS){
        insuredBirthdayList.push({ p, days, kind:'birthday_insured', done: isContacted(p,'birthday_insured',p.insuredBirthday) });
      }
    }
    const bdApplicant = parseDateFlexible(p.applicantBirthday);
    if(bdApplicant && p.applicant && p.applicant !== p.insured){
      const days = daysUntilNextOccurrence(bdApplicant);
      if(days !== null && days <= REMIND_WINDOW_DAYS){
        applicantBirthdayList.push({ p, days, kind:'birthday_applicant', done: isContacted(p,'birthday_applicant',p.applicantBirthday) });
      }
    }
    const nc = parseDateFlexible(p.nextCheckDate);
    if(nc){
      const days = daysUntilFixedDate(nc);
      if(days !== null && days <= REMIND_WINDOW_DAYS){
        checkList.push({ p, days, kind:'check', done: isContacted(p,'check',p.nextCheckDate) });
      }
    }
    const nd = parseDateFlexible(p.nextDueDate);
    if(nd){
      const days = daysUntilFixedDate(nd);
      if(days !== null && days <= REMIND_WINDOW_DAYS){
        renewalList.push({ p, days, kind:'renew', done: isContacted(p,'renew',p.nextDueDate) });
      }
    }
  });
  insuredBirthdayList.sort((a,b)=>a.days-b.days);
  applicantBirthdayList.sort((a,b)=>a.days-b.days);
  checkList.sort((a,b)=>a.days-b.days);
  renewalList.sort((a,b)=>a.days-b.days);
  return { insuredBirthdayList, applicantBirthdayList, checkList, renewalList };
}

function daysLabel(days){
  if(days < 0) return `已過期 ${Math.abs(days)} 天`;
  if(days === 0) return '就是今天';
  return `${days} 天後`;
}

let activeSegmentFilter = null;

function renderSegmentChips(){
  const chipsEl = document.getElementById('segment-chips');
  if(!chipsEl) return;
  const counts = {};
  SEGMENT_DEFS.forEach(seg=> counts[seg.key] = 0);
  policies.forEach(p=> computeInsightTags(p).forEach(tag=>{
    const seg = SEGMENT_DEFS.find(s=>s.label===tag.label);
    if(seg) counts[seg.key]++;
  }));
  chipsEl.innerHTML = SEGMENT_DEFS.map(seg=>{
    const active = activeSegmentFilter === seg.key;
    const bg = active ? (seg.tone==='gold' ? '#C9A227' : '#2F6F62') : '#fff';
    const color = active ? '#fff' : '#4A5266';
    return `<button onclick="toggleSegmentFilter('${seg.key}')" style="border:1px solid ${active?'transparent':'var(--line)'}; background:${bg}; color:${color}; border-radius:999px; padding:4px 10px; font-size:11px; cursor:pointer; font-family:inherit;">${esc(seg.label)} (${counts[seg.key]})</button>`;
  }).join('');
}
function toggleSegmentFilter(key){
  activeSegmentFilter = activeSegmentFilter === key ? null : key;
  renderList();
}

function renderList(){
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const listEl = document.getElementById('list');
  const { insuredBirthdayList, applicantBirthdayList, checkList, renewalList } = getReminders();
  const flagIds = new Set([...insuredBirthdayList, ...applicantBirthdayList, ...checkList, ...renewalList].filter(x=>!x.done).map(x=>x.p.id));

  renderSegmentChips();

  const filtered = policies.filter(p=>{
    if(q && ![p.policyNumber,p.insured,p.applicant,p.insurer].some(v=> (v||'').toLowerCase().includes(q))) return false;
    if(activeSegmentFilter && !computeInsightTags(p).some(t=> SEGMENT_DEFS.find(s=>s.key===activeSegmentFilter && s.label===t.label))) return false;
    return true;
  });

/* ---- task state: which template variant, done-list visibility, batch selection ---- */
let templateChoice = { birthday_insured:0, birthday_applicant:0, check:0, renew:0 };
let showDone = { birthday_insured:false, birthday_applicant:false, check:false, renew:false };
let batchSelected = { birthday_insured:new Set(), birthday_applicant:new Set(), check:new Set(), renew:new Set() };

function setTemplateChoice(kind, idx){ templateChoice[kind] = +idx; renderMain(); }
function toggleShowDone(kind){ showDone[kind] = !showDone[kind]; renderMain(); }
function toggleBatchSelect(kind, policyId, checked){
  if(checked) batchSelected[kind].add(policyId); else batchSelected[kind].delete(policyId);
  renderMain();
}
function markContacted(evt, policyId, kind){
  if(evt) evt.stopPropagation();
  const p = policies.find(x=>x.id===policyId);
  if(!p) return;
  if(!p.contactedFor) p.contactedFor = { birthday_insured:'', birthday_applicant:'', check:'', renew:'' };
  const valueMap = { birthday_insured:p.insuredBirthday, birthday_applicant:p.applicantBirthday, check:p.nextCheckDate, renew:p.nextDueDate };
  p.contactedFor[kind] = valueMap[kind] || 'done';
  saveData();
  batchSelected[kind].delete(policyId);
  renderList();
  renderMain();
}
function unmarkContacted(evt, policyId, kind){
  if(evt) evt.stopPropagation();
  const p = policies.find(x=>x.id===policyId);
  if(!p || !p.contactedFor) return;
  p.contactedFor[kind] = '';
  saveData();
  renderList();
  renderMain();
}

/* ---- batch send stepper ---- */
let batchQueue = [];
let batchIndex = 0;
function startBatchSend(evt, kind){
  if(evt) evt.stopPropagation();
  const ids = Array.from(batchSelected[kind]);
  if(ids.length===0) return;
  batchQueue = ids.map(id=>({ p: policies.find(x=>x.id===id), kind })).filter(x=>x.p);
  batchIndex = 0;
  if(batchQueue.length===0) return;
  renderBatchStepper();
  document.getElementById('batch-overlay').style.display = 'flex';
}
function renderBatchStepper(){
  const item = batchQueue[batchIndex];
  const msg = reminderMessage(item.kind, item.p, templateChoice[item.kind]);
  document.getElementById('batch-progress').textContent = `${batchIndex+1} / ${batchQueue.length}`;
  document.getElementById('batch-name').textContent = item.p.insured || '—';
  document.getElementById('batch-msg-preview').textContent = msg;
  document.getElementById('batch-next-btn').textContent = (batchIndex < batchQueue.length-1) ? '下一位' : '完成';
}
function batchSendCurrent(){
  const item = batchQueue[batchIndex];
  const msg = reminderMessage(item.kind, item.p, templateChoice[item.kind]);
  window.open(lineShareUrl(msg), '_blank');
  markContacted(null, item.p.id, item.kind);
}
function batchNext(){
  if(batchIndex < batchQueue.length-1){ batchIndex++; renderBatchStepper(); }
  else { closeBatchStepper(); }
}
function closeBatchStepper(){
  document.getElementById('batch-overlay').style.display = 'none';
  batchQueue = []; batchIndex = 0;
  renderMain();
}

function reminderGroupHtml(title, iconSvg, items, sublineFn, kind){
  const pending = items.filter(it=>!it.done);
  const done = items.filter(it=>it.done);
  const selectedCount = batchSelected[kind].size;
  const variants = MESSAGE_TEMPLATE_LABELS[kind] || [];

  const templateSelect = variants.length ? `
    <select onchange="setTemplateChoice('${kind}', this.value)" style="font-size:11px; border:1px solid var(--line); border-radius:6px; padding:3px 6px; background:#fff; color:var(--muted);">
      ${variants.map((label,i)=>`<option value="${i}" ${templateChoice[kind]===i?'selected':''}>${esc(label)}</option>`).join('')}
    </select>` : '';

  if(pending.length===0 && done.length===0){
    return `<div class="section-card">
      <div class="section-head">${iconSvg}<h2 class="serif">${title}</h2></div>
      <p style="color:var(--muted); font-size:13px; margin:0;">近 ${REMIND_WINDOW_DAYS} 天內無提醒事項</p>
    </div>`;
  }

  function rowHtml({p,days,kind:k,done:isDone}){
    const overdue = days < 0;
    const checked = batchSelected[k].has(p.id);
    return `<div class="reminder-row" style="${isDone?'opacity:.55;':''}" onclick="selectPolicy('${p.id}')">
      <div style="display:flex; align-items:center; gap:10px; min-width:0;">
        ${!isDone ? `<input type="checkbox" onclick="event.stopPropagation()" onchange="toggleBatchSelect('${k}','${p.id}', this.checked)" ${checked?'checked':''} style="width:16px; height:16px; flex-shrink:0;" />` : `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2F6F62" stroke-width="2" style="flex-shrink:0;"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>`}
        <div style="min-width:0;">
          <div class="reminder-name">${esc(p.insured)||'—'}</div>
          <div class="reminder-sub">${sublineFn(p)}</div>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
        <span class="pill ${overdue?'pill-bad':'pill-warn'}"><span class="dot ${overdue?'dot-bad':'dot-warn'}"></span>${daysLabel(days)}</span>
        ${isDone
          ? `<button class="btn btn-ghost" style="padding:6px 8px; font-size:11px;" onclick="unmarkContacted(event,'${p.id}','${k}')" title="取消標記">↺</button>`
          : `<button class="btn btn-ghost" style="padding:6px 8px; font-size:11px;" onclick="markContacted(event,'${p.id}','${k}')" title="標記已聯絡">
               <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#2F6F62" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
             </button>
             <button class="btn btn-ghost" style="padding:6px 8px; font-size:11px;" onclick="openLineShare(event, ${esc(JSON.stringify(reminderMessage(k,p,templateChoice[k])))})" title="用 LINE 傳送提醒">
               <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#2F6F62" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
             </button>`
        }
      </div>
    </div>`;
  }

  return `<div class="section-card">
    <div class="section-head" style="flex-wrap:wrap; gap:8px;">
      ${iconSvg}<h2 class="serif">${title}</h2>
      <span class="subtotal">${pending.length} 待處理</span>
      ${templateSelect}
    </div>
    ${selectedCount>0 ? `
    <div style="display:flex; align-items:center; justify-content:space-between; background:#EEF3F0; border-radius:8px; padding:8px 10px; margin-bottom:8px; font-size:12px;">
      <span>已選 ${selectedCount} 位</span>
      <button class="btn btn-primary" style="padding:6px 10px; font-size:12px;" onclick="startBatchSend(event,'${kind}')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        開始批次傳送
      </button>
    </div>` : ''}
    ${pending.map(rowHtml).join('') || '<p style="color:var(--muted); font-size:13px; margin:0;">這個分類目前沒有待處理項目</p>'}
    ${done.length ? `
    <button class="link-btn" style="margin-top:8px;" onclick="toggleShowDone('${kind}')">${showDone[kind]?'隱藏':'顯示'}已處理（${done.length}）</button>
    ${showDone[kind] ? done.map(rowHtml).join('') : ''}
    ` : ''}
  </div>`;
}

/* ---------- CSV export / import (backup, bulk edit, external tools) ---------- */
const CSV_COLUMNS = [
  'policyNumber','insurer','insured','applicant','insuredBirthday','applicantBirthday','phone','currency','coverageUnit',
  'effectiveDate','status','payMethod','advanceStatus','payChannel','bank','cardLast4','cardExpiry',
  'nextDueDate','nextDeductDate','lastCheckDate','nextCheckDate','checkNotes','notes',
  'coveragesJson','beneficiariesJson','logsJson'
];

function csvField(v){
  const s = v==null ? '' : String(v);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function exportCSV(){
  const rows = [CSV_COLUMNS.join(',')];
  policies.forEach(p=>{
    const row = CSV_COLUMNS.map(col=>{
      if(col==='coveragesJson') return csvField(JSON.stringify(p.coverages||[]));
      if(col==='beneficiariesJson') return csvField(JSON.stringify(p.beneficiaries||[]));
      if(col==='logsJson') return csvField(JSON.stringify(p.logs||[]));
      return csvField(p[col]);
    });
    rows.push(row.join(','));
  });
  const csvContent = '\uFEFF' + rows.join('\r\n'); // BOM so Excel opens Chinese text correctly
  const blob = new Blob([csvContent], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `保單資料_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function parseCsv(text){
  // minimal RFC4180-ish CSV parser: handles quoted fields with embedded commas/newlines/escaped quotes
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\r'){ /* skip */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=> r.length>1 || (r.length===1 && r[0]!==''));
}

function handleCsvImport(evt){
  const file = evt.target.files && evt.target.files[0];
  evt.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      let text = reader.result;
      if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // strip BOM
      const rows = parseCsv(text);
      if(rows.length < 2){ showError('CSV 內容看起來是空的'); return; }
      const header = rows[0];
      const imported = [];
      for(let r=1; r<rows.length; r++){
        const cells = rows[r];
        const obj = {};
        header.forEach((col,i)=> obj[col] = cells[i] || '');
        const p = emptyPolicy();
        CSV_COLUMNS.forEach(col=>{
          if(col==='coveragesJson'){ try{ p.coverages = JSON.parse(obj[col]||'[]'); }catch(_e){} }
          else if(col==='beneficiariesJson'){ try{ p.beneficiaries = JSON.parse(obj[col]||'[]'); }catch(_e){} }
          else if(col==='logsJson'){ try{ p.logs = JSON.parse(obj[col]||'[]'); }catch(_e){} }
          else if(col in obj) p[col] = obj[col];
        });
        if(p.policyNumber || p.insured) imported.push(p);
      }
      if(imported.length === 0){ showError('沒有解析到有效的保單資料，請確認 CSV 格式'); return; }
      policies = imported.concat(policies); // import as new entries, existing data untouched
      saveData();
      renderList();
      renderMain();
      showError(`已匯入 ${imported.length} 筆保單資料（新增方式加入，未覆蓋原有資料）`);
    }catch(e){
      showError('CSV 匯入失敗，請確認檔案格式是否正確');
    }
  };
  reader.readAsText(file, 'utf-8');
}

function deletePolicy(id){
  if(!confirm('確定要刪除這筆保單資料嗎？此動作無法復原。')) return;
  policies = policies.filter(p=>p.id!==id);
  if(selectedId===id) selectedId = policies[0]?.id || null;
  saveData();
  renderList();
  renderMain();
}

function commitEdit(){
  if(!editing.policyNumber || !editing.policyNumber.trim()){
    showError('請輸入保單號碼');
    return;

  const exists = policies.some(p=>p.id===editing.id);
  if(exists){
    policies = policies.map(p=> p.id===editing.id ? editing : p);
  }else{
    policies = [editing, ...policies];
  }

  closeModal();

  document.getElementById('tab-customers').classList.add('active');
  document.getElementById('sidebar').style.display = 'flex';
  renderList();
  renderMain();
}

/* ---------- OCR: photo/upload recognition ---------- */
async function preprocessImageForOcr(file){
  const imgUrl = URL.createObjectURL(file);
  const img = await new Promise((res, rej)=>{
    const im = new Image();
    im.onload = ()=>res(im);
    im.onerror = rej;
    im.src = imgUrl;
  });
  // Upscale small screenshots — Tesseract does noticeably better on larger strokes.
  const scale = img.width < 1400 ? 2 : 1.3;
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(img.width * scale);
  canvas.height = Math.round(img.height * scale);
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  URL.revokeObjectURL(imgUrl);

  // Grayscale + contrast stretch: flattens screenshot backgrounds/gradients and makes
  // text edges sharper, which measurably helps Tesseract's Chinese recognition.
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = imgData.data;
  let min = 255, max = 0;
  const gray = new Uint8ClampedArray(d.length / 4);
  for(let i=0, p=0; i<d.length; i+=4, p++){
    const g = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    gray[p] = g;
    if(g < min) min = g;
    if(g > max) max = g;
  }
  const range = Math.max(1, max - min);
  for(let i=0, p=0; i<d.length; i+=4, p++){
    let v = (gray[p] - min) * (255 / range);
    v = v < 110 ? v*0.6 : Math.min(255, v*1.08); // deepen dark text, brighten light background
    d[i] = d[i+1] = d[i+2] = v;
  }
  ctx.putImageData(imgData, 0, 0);
  return canvas;
}

function parseTextInput(){
  const textEl = document.getElementById('ocr-text-input');
  const val = textEl ? textEl.value : '';
  if(!val || !val.trim()){
    showError('請先貼上文字內容再解析');
    return;
  }
  if(!editing){
    showError('請先開啟新增或編輯保單表單');
    return;
  }
  const parsed = parseOcrText(val);
  lastOcrRawText = val;
  mergeOcrIntoEditing(parsed);
  renderModalBody();
  showError('已將貼上文字解析出的欄位帶入下方表單，請仔細核對後再儲存');
}

async function handleOcrFiles(evt){
  const files = Array.from(evt.target.files || []);
  evt.target.value = ''; // allow re-selecting the same file later
  if(files.length === 0) return;

  if(typeof Tesseract === 'undefined'){
    showError('辨識功能的程式庫載入失敗，請確認是用 Safari／Chrome 開啟這個網址（而不是在 GitHub App 內建的預覽視窗），並確認網路連線後重新整理頁面');
    return;
  }
  if(navigator.onLine === false){
    showError('目前偵測不到網路連線，圖片辨識第一次使用需要下載中文字庫，請連上網路後再試');
    return;
  }

  const overlay = document.getElementById('ocr-overlay');
  const statusEl = document.getElementById('ocr-status');
  const subEl = document.getElementById('ocr-substatus');
  overlay.style.display = 'flex';

  let combinedText = '';
  let worker;
  try{
    statusEl.textContent = '準備辨識引擎';
    subEl.textContent = '首次使用需下載中文字庫（約數MB）…';
    worker = await Tesseract.createWorker('chi_tra+eng', 1, {
      langPath: 'https://cdn.jsdelivr.net/gh/naptha/tessdata@gh-pages/4.0.0',
      logger: m=>{
        if(m.status && m.progress != null){
          const labelMap = {
            'loading tesseract core':'載入核心模組',
            'initializing tesseract':'初始化',
            'loading language traineddata':'下載中文字庫',
            'initializing api':'準備辨識',
            'recognizing text':'分析文字'
          };
          const label = labelMap[m.status] || m.status;
          subEl.textContent = `${label} ${Math.round(m.progress*100)}%`;
        }
      }
    });
    // PSM 6 = "uniform block of text" — better suited to structured app/table screenshots
    // than the default automatic layout detection.
    await worker.setParameters({ tessedit_pageseg_mode: '6' });

    for(let i=0; i<files.length; i++){
      statusEl.textContent = `辨識中 (${i+1}/${files.length})`;
      subEl.textContent = '影像前處理中…';
      const canvas = await preprocessImageForOcr(files[i]);
      const { data } = await worker.recognize(canvas);
      combinedText += '\n' + (data.text || '');
    }
  }catch(e){
    overlay.style.display = 'none';
    console.error('OCR error:', e);
    const detail = (e && (e.message || e.toString())) || '未知錯誤';
    showError(`圖片辨識失敗（${detail}）。請確認是用 Safari／Chrome 開啟此網址、網路連線正常，若持續失敗請直接手動輸入`);
    if(worker){ try{ await worker.terminate(); }catch(_e){} }
    return;
  }
  if(worker){ try{ await worker.terminate(); }catch(_e){} }
  overlay.style.display = 'none';

  const parsed = parseOcrText(combinedText);
  lastOcrRawText = combinedText;
  mergeOcrIntoEditing(parsed);
  renderModalBody();
  showError('已將辨識到的欄位帶入下方表單，請仔細核對後再儲存（險種明細等表格類資料辨識率較低，請特別確認）');
}

function mergeOcrIntoEditing(parsed){
  if(!editing) return;
  const scalarKeys = ['policyNumber','currency','coverageUnit','status','advanceStatus','insured','applicant','phone',
    'effectiveDate','payMethod','payChannel','bank','cardLast4','cardExpiry','nextDueDate','nextDeductDate'];
  scalarKeys.forEach(k=>{
    if(parsed[k]) editing[k] = parsed[k];
  });
  if(parsed.beneficiaries && parsed.beneficiaries.length){
    const existingBlank = editing.beneficiaries.length===1 && !editing.beneficiaries[0].name;
    if(existingBlank){
      editing.beneficiaries = parsed.beneficiaries;
    } else {
      // match by name so re-scanning the same document corrects an existing row
      // in place instead of piling up duplicates.
      parsed.beneficiaries.forEach(newB=>{
        const idx = editing.beneficiaries.findIndex(b=> b.name === newB.name);
        if(idx !== -1) editing.beneficiaries[idx] = newB;
        else editing.beneficiaries.push(newB);
      });
    }
  }
  if(parsed.coverages && parsed.coverages.length){
    const existingBlank = editing.coverages.length===1 && !editing.coverages[0].name;
    if(existingBlank){
      editing.coverages = parsed.coverages;
    } else {
      // match by product code (embedded in the name as "名稱 (代碼)") so re-parsing after
      // a parsing-bug fix updates the existing row's numbers instead of duplicating it.
      const codeOf = name => (String(name).match(/\(([^()]+)\)\s*$/) || [])[1] || name;
      parsed.coverages.forEach(newC=>{
        const newCode = codeOf(newC.name);
        const idx = editing.coverages.findIndex(c=> codeOf(c.name) === newCode);
        if(idx !== -1) editing.coverages[idx] = newC;
        else editing.coverages.push(newC);
      });
    }
  }
}

function ocrLines(text){
  // Tesseract's Chinese recognition frequently inserts spaces between characters
  // (e.g. "被 保 險 人"), which breaks straightforward substring label matching.
  // Strip internal whitespace per line while keeping line breaks intact.
  return text.split('\n')
    .map(l=> l.replace(/[ \t\u3000]+/g, '').trim())
    .filter(l=>l.length>0);
}

// Every label the parser looks for, used to stop a value from swallowing the next
// field when OCR merges multiple labels onto one line (e.g. "A058051900保單幣別:台幣").
const ALL_OCR_LABELS = [
  '保單號碼','保單幣別','保單生效日','保單狀態','主約繳法','墊繳狀態','被保險人','要保人','查詢日期',
  '聯絡電話','電話','繳費方式','卡號','信用卡有效期限','有效期限','下期應繳日期','預計扣款日',
  '幣值單位','姓名','分配方式/比例','分配方式','一次給付','分期給付','給付期間','給付方式',
  '銀行名稱','分行名稱','帳號','聯絡地址','險種名稱','保額','保障狀態','生效日','停效日','保費','職業等級'
];

function trimAtNextLabel(str){
  let cut = str.length;
  for(const label of ALL_OCR_LABELS){
    const idx = str.indexOf(label);
    if(idx > 0 && idx < cut) cut = idx;
  }
  return str.slice(0, cut).trim();
}

function ocrValueAfterLabel(lines, labels){
  for(let i=0;i<lines.length;i++){
    for(const label of labels){
      const idx = lines[i].indexOf(label);
      if(idx === -1) continue;
      let rest = lines[i].slice(idx + label.length).replace(/^[:：\s]+/, '').trim();
      rest = trimAtNextLabel(rest);
      if(rest) return rest;
      // value likely on next non-empty line(s)
      for(let j=i+1; j<Math.min(i+3, lines.length); j++){
        if(lines[j] && !labels.some(l=>lines[j].includes(l))){
          return trimAtNextLabel(lines[j].trim());
        }
      }
    }
  }
  return '';
}

function findFirstDateWestern(str){
  const m = str.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  return m ? `${m[1]}/${String(+m[2]).padStart(2,'0')}/${String(+m[3]).padStart(2,'0')}` : '';
}

function findPolicyNumberFallback(flat){
  // common insurer policy-number shapes: 1-2 letters followed by 6-10 digits, no label needed
  const m = flat.match(/\b[A-Z]{1,2}\d{6,10}\b/);
  return m ? m[0] : '';
}

function parseOcrText(text){
  const lines = ocrLines(text);
  const flat = lines.join(' ');
  const out = {};

  out.policyNumber = (ocrValueAfterLabel(lines, ['保單號碼']) || findPolicyNumberFallback(flat)).replace(/\s/g,'');
  out.currency = ocrValueAfterLabel(lines, ['保單幣別']);
  out.coverageUnit = ocrValueAfterLabel(lines, ['幣值單位']);
  out.status = ocrValueAfterLabel(lines, ['保單狀態']);
  out.advanceStatus = ocrValueAfterLabel(lines, ['墊繳狀態']);
  out.insured = ocrValueAfterLabel(lines, ['被保險人']).replace(/\s/g,'');
  out.applicant = ocrValueAfterLabel(lines, ['要保人']).replace(/\s/g,'');
  out.phone = ocrValueAfterLabel(lines, ['聯絡電話','電話']);

  // effective date: look for a block near 保單生效日 with a western-format date
  {
    const idx = lines.findIndex(l=>l.includes('保單生效日'));
    if(idx !== -1){
      for(let j=idx; j<Math.min(idx+4, lines.length); j++){
        const d = findFirstDateWestern(lines[j]);
        if(d){ out.effectiveDate = d; break; }
      }
    }
  }

  // pay method: prefer the one under 繳費方式 heading; 主約繳法 also appears (年繳/月繳 etc.)
  const payMethodVal = ocrValueAfterLabel(lines, ['主約繳法']);
  if(payMethodVal) out.payMethod = payMethodVal;

  const payChannelVal = ocrValueAfterLabel(lines, ['繳費方式']);
  if(payChannelVal){
    out.payChannel = payChannelVal;
    const dash = payChannelVal.split(/[-－]/);
    if(dash.length > 1) out.bank = dash[dash.length-1].trim();
  }

  const cardVal = ocrValueAfterLabel(lines, ['卡號']);
  if(cardVal){
    const digits = cardVal.match(/(\d{2,4})\s*$/);
    if(digits) out.cardLast4 = digits[1].slice(-4);
  }

  const expiryVal = ocrValueAfterLabel(lines, ['信用卡有效期限','有效期限']);
  {
    const m = (expiryVal||flat).match(/(\d{1,2})\s*\/\s*(\d{2,4})/);
    if(m) out.cardExpiry = `${m[1]}/${m[2].slice(-2)}`;
  }

  // renewal dates often appear together in one sentence
  {
    const dueMatch = flat.match(/下期應繳日期\s*[:：]?\s*(\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2})/);
    if(dueMatch) out.nextDueDate = findFirstDateWestern(dueMatch[1]);
    const deductMatch = flat.match(/預計扣款日\s*[:：]?\s*(\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2})/);
    if(deductMatch) out.nextDeductDate = findFirstDateWestern(deductMatch[1]);
  }

  // beneficiaries: repeated "姓名" + "分配方式/比例" pairs anywhere in the document.
  // OCR noise (icons misread as text, stray brackets, the label text itself) is filtered
  // out by requiring a plausible Chinese-name-like string that isn't one of our own labels.
  {
    const beneficiaries = [];
    for(let i=0;i<lines.length;i++){
      if(/^姓名[:：]?$/.test(lines[i]) || lines[i]==='姓名'){
        let name = '';
        for(let j=i+1;j<Math.min(i+3,lines.length);j++){
          const candidate = trimAtNextLabel(lines[j]);
          const looksLikeName = candidate && /[\u4e00-\u9fa5]/.test(candidate) && !ALL_OCR_LABELS.includes(candidate);
          if(looksLikeName){ name = candidate; break; }
        }
        let rank = '';
        for(let j=i+1;j<Math.min(i+8,lines.length);j++){
          if(lines[j].includes('順位')){ rank = trimAtNextLabel(lines[j]); break; }
        }
        if(name) beneficiaries.push({ id: uid(), name: name.replace(/[:：]/g,'').trim(), rank: rank || '' });
      }
    }
    if(beneficiaries.length) out.beneficiaries = beneficiaries;
  }

  // coverage rows: the source table always follows this column order per row:
  // 代碼, 名稱, 保額, 保障狀態(有效/停效), 生效日(民國), 生效日(西元), 停效日(-或日期), 保費, 職業等級(-或數字).
  // Walking that fixed sequence (instead of grabbing "the first number found" as premium)
  // avoids swapping 保額 and 保費, which was the previous bug.
  {
    const coverages = [];
    const codeLineRe = /^[0-9A-Z]{2,10}$/;
    const isDateLikeLine = l => /民國|\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}/.test(l) || l === '-';
    for(let i=0;i<lines.length;i++){
      if(codeLineRe.test(lines[i]) && /[A-Z]/.test(lines[i])){
        let nameIdx = -1, name = '';
        for(let j=i+1;j<Math.min(i+3,lines.length);j++){
          if(/[\u4e00-\u9fa5]/.test(lines[j])){ name = lines[j]; nameIdx = j; break; }
        }
        if(!name) continue;

        let cursor = nameIdx + 1;
        let amount = '';
        if(lines[cursor] && lines[cursor] !== '有效' && lines[cursor] !== '停效'){
          amount = lines[cursor]; cursor++;
        }

        let status = '有效';
        if(lines[cursor] && (lines[cursor].includes('有效') || lines[cursor].includes('停效'))){
          status = lines[cursor].includes('停效') ? '停效' : '有效';
          cursor++;
        }

        let effDate = '';
        for(let k=0; k<4 && cursor<lines.length && isDateLikeLine(lines[cursor]); k++){
          const d = findFirstDateWestern(lines[cursor]);
          if(d && !effDate) effDate = d;
          cursor++;
        }

        let premium = '';
        if(lines[cursor] && /^[\d,]+$/.test(lines[cursor])){
          premium = lines[cursor];
        }

        coverages.push({ id: uid(), name: `${name} (${lines[i]})`, amount, status, effectiveDate: effDate, premium });
      }
    }
    if(coverages.length) out.coverages = coverages;
  }

  // free-text note capturing anything we couldn't confidently structure, for manual review
  out.notes = '（拍照辨識來源，請核對內容）';

  return out;
}
